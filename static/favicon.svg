<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo escuro terminal -->
  <rect width="64" height="64" rx="10" fill="#0a0e17"/>
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#00ff66" stroke-width="2"/>

  <!-- Ossos cruzados de pirataria / resistencia retrô -->
  <path d="M12 12 L52 52 M52 12 L12 52" stroke="#ff0055" stroke-width="4" stroke-linecap="square"/>
  <rect x="8" y="8" width="8" height="8" fill="#ff0055"/>
  <rect x="48" y="8" width="8" height="8" fill="#ff0055"/>
  <rect x="8" y="48" width="8" height="8" fill="#ff0055"/>
  <rect x="48" y="48" width="8" height="8" fill="#ff0055"/>

  <!-- Cranio Cyberpunk / Rebeldia (O Refugio) -->
  <!-- Topo da cabeca -->
  <path d="M22 18 H42 V38 H22 Z" fill="#00ff66"/>
  <rect x="20" y="22" width="24" height="14" fill="#00ff66"/>
  
  <!-- Bandana de pirata cibernetico no topo -->
  <rect x="20" y="18" width="24" height="6" fill="#ffb000"/>
  <rect x="44" y="20" width="6" height="4" fill="#ffb000"/>

  <!-- Olho esquerdo (cyber reticle neon) -->
  <rect x="24" y="26" width="5" height="5" fill="#0a0e17"/>
  <rect x="26" y="28" width="1" height="1" fill="#00f0ff"/>

  <!-- Olho direito (tapa-olho de pirata hacker com corte em X) -->
  <rect x="35" y="26" width="5" height="5" fill="#0a0e17"/>
  <path d="M33 24 L42 33" stroke="#ff0055" stroke-width="2"/>

  <!-- Nariz triangular invertido -->
  <polygon points="32,32 30,35 34,35" fill="#0a0e17"/>

  <!-- Maxilar e dentes de grade terminal -->
  <rect x="25" y="38" width="14" height="9" fill="#00ff66"/>
  <rect x="28" y="40" width="2" height="5" fill="#0a0e17"/>
  <rect x="31" y="40" width="2" height="5" fill="#0a0e17"/>
  <rect x="34" y="40" width="2" height="5" fill="#0a0e17"/>
</svg>
